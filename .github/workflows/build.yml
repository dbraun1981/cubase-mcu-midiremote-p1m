# Updated to use Node 24 LTS
name: build

on: [push, pull_request]

jobs:
  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        # use v4 of the official action and pin to Node 24.x
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build scripts
        run: npm run build
      - name: Upload scripts
        uses: actions/upload-artifact@v3
        if: github.ref != 'refs/heads/main' && matrix.os == 'ubuntu-latest'
        with:
          name: scripts
          path: dist/
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build
    if: github.repository_owner == 'dbraun1981' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
